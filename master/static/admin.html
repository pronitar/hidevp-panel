  if (LANG !== "en" || !s || !CYR.test(s)) return s;

  if (root.nodeType === 3) { const pn = root.parentNode; if (pn && pn.closest && pn.closest(".notr")) return; if (!SKIP.has(pn && pn.nodeName)) { const t = tr(root.data); if (t !== root.data) root.data = t; } return; }

    if (el.closest && el.closest(".notr")) continue;
    for (const a of ["placeholder","title","label"]) { const v = el.getAttribute && el.getAttribute(a); if (v && CYR.test(v)) el.setAttribute(a, tr(v)); }
  }
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(trNode);
}

const BK_PARTS = [["users","Пользователи","подписки, лимиты, привязка Telegram"],["servers","Серверы","узлы с ключами подключения"],
  ["vpns","VPN-подключения","вместе с серверами"],["stats","Статистика трафика","счётчики использованного трафика"],
  ["payments","Оплаты","история оплат, счета CryptoBot и переводы"],["promos","Промокоды","и их использования"],
  ["notices","Уведомления","технические работы и новости"],["settings","Настройки","бот, тарифы и оплата, общие настройки"]];
function bkKind(){ const r = document.querySelector("input[name=bk_kind]:checked"); return r ? r.value : "full"; }
function bkParts(){
  if (bkKind() === "full") return "";
  const p = [...document.querySelectorAll(".bk_part:checked")].map(c => c.value);
  if (!p.length) { toast("Выберите, что сохранить в копии", true); return null; }
  return p.join(",");
}
function partsText(parts){
  if (!parts || parts.length >= BK_PARTS.length) return "полная";
  return parts.map(k => (BK_PARTS.find(x => x[0] === k) || [k, k])[1]).join(", ");
}
function downloadBackup(){
  const p = bkParts(); if (p === null) return;
  const a = document.createElement("a"); a.href = BASE + "api/backup" + (p ? "?parts=" + encodeURIComponent(p) : ""); a.download = "";
  document.body.appendChild(a); a.click(); a.remove();
}
async function createServerBackup(){
  const p = bkParts(); if (p === null) return;
  await act(()=>call("POST","backups/create", p ? {parts: p.split(",")} : {}),"Копия сохранена"); loadBackups();
}
async function delBackup(name){ if(!confirm("Удалить эту копию с сервера?")) return; await act(()=>call("DELETE","backups/"+encodeURIComponent(name)),"Удалено"); loadBackups(); }
function restoreResult(r){

function statsQuery(){
  const now = Date.now()/1000, day = 86400; let from = 0, to = 0;
  if (SF.period === "custom") { from = SF.from ? new Date(SF.from+"T00:00").getTime()/1000 : 0; to = SF.to ? new Date(SF.to+"T00:00").getTime()/1000 + day : 0; }
  else if (SF.period !== "all") { const d = new Date(); d.setHours(0,0,0,0); from = d.getTime()/1000 - (+SF.period - 1)*day; }
  const p = new URLSearchParams({from, to, tz: new Date().getTimezoneOffset(), user: SF.user, user_id: SF.user_id, method: SF.method, currency: SF.currency, months: SF.months});
  return p.toString();
}
function barChart(labels, values, opts={}){
  const W = opts.w || 760, H = opts.h || 200, pl = 44, pb = 22, pt = 10, n = values.length || 1, max = Math.max(1, ...values);
  const step = (W - pl - 8) / n, bw = Math.max(1, step * 0.72);
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
  const top = nice(max), fmt = opts.fmt || (v => v);
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  const ticks = [0, top/2, top].map(v => `<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl-6}" y="${y(v)+4}" class="ax" text-anchor="end">${esc(String(fmt(v)))}</text>`).join("");
  const every = Math.ceil(n / (W < 500 ? 5 : 8));
  const bars = values.map((v,i) => `<rect x="${pl + i*step + (step-bw)/2}" y="${y(v)}" width="${bw}" height="${Math.max(0, y(0)-y(v))}" rx="2" class="bar"><title>${esc(labels[i])}: ${esc(String(fmt(v)))}</title></rect>`).join("");
  const xl = labels.map((l,i) => i % every === 0 ? `<text x="${pl + i*step + step/2}" y="${H-6}" class="ax" text-anchor="middle">${esc(shortLabel(l))}</text>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${ticks}${bars}${xl}</svg>`;
}

}
function segbtn(sel, key, cur, fn, quiet){
  const box = $(sel); if (!box) return;
  box.querySelectorAll("button").forEach(b => { b.classList.toggle("on", b.dataset[key] === cur); if (!quiet && fn) b.onclick = () => { box.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b)); fn(b.dataset[key]); }; });
}
const BUI_NAMES = {buy:"Купить / продлить", page:"Страница подписки", me:"Моя подписка", promo:"Промокод", help:"Как подключиться", phone:"Привязать номер", support:"Поддержка", lang:"Сменить язык"};
function buiList(){
  const L = BUI.cfg.buttons, el = $("#bui_list");
  el.innerHTML = L.map((b,i) => {
    const own = !BUI.builtin[b.id], def = BUI.builtin[b.id] || ["",""];
    return `<div class="brow ${b.on===false?"off":""} ${b.same_row&&i>0?"joined":""}">
      <div class="mv"><button onclick="buiMove(${i},-1)" ${i===0?"disabled":""}>▲</button><button onclick="buiMove(${i},1)" ${i===L.length-1?"disabled":""}>▼</button></div>
      <input type="checkbox" title="Показывать" ${b.on!==false?"checked":""} onchange="buiSet(${i},'on',this.checked)">
      <input type="text" class="notr" placeholder="${esc(def[0]||"Подпись RU")}" value="${esc(b.ru||"")}" oninput="buiSet(${i},'ru',this.value,1)">
      <input type="text" class="en notr" placeholder="${esc(def[1]||"Label EN")}" value="${esc(b.en||"")}" oninput="buiSet(${i},'en',this.value,1)">
      ${own?`<button class="btn sm d" onclick="buiDel(${i})" title="Удалить">✕</button>`:"<span></span>"}
      <div class="meta"><span class="tag">${own?(b.type==="url"?"ссылка":"сообщение"):esc(BUI_NAMES[b.id]||b.id)}</span>${own?"":`<span>${esc(BUI.hints[b.id]||"")}</span>`}
        ${i>0?`<label><input type="checkbox" ${b.same_row?"checked":""} onchange="buiSet(${i},'same_row',this.checked)"> В строке с предыдущей</label>`:""}</div>
      ${own&&b.type==="url"?`<div class="extra"><input type="text" placeholder="https://… или tg://…" value="${esc(b.url||"")}" oninput="buiSet(${i},'url',this.value,1)"></div>`:""}
      ${own&&b.type==="text"?`<div class="extra row2"><textarea class="notr" rows="3" placeholder="Текст сообщения (RU)" oninput="buiSet(${i},'text_ru',this.value,1)">${esc(b.text_ru||"")}</textarea><textarea class="notr" rows="3" placeholder="Message text (EN)" oninput="buiSet(${i},'text_en',this.value,1)">${esc(b.text_en||"")}</textarea></div>`:""}
    </div>`; }).join("");
}
function buiSet(i, k, v, soft){ BUI.cfg.buttons[i][k] = v; if (!soft) buiList(); buiPreview(); }
function buiMove(i, d){ const L = BUI.cfg.buttons, j = i + d; if (j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; buiList(); buiPreview(); }
function buiDel(i){ BUI.cfg.buttons.splice(i,1); buiList(); buiPreview(); }
function buiAdd(type){
  const id = "c_" + Math.random().toString(16).slice(2,8);
  BUI.cfg.buttons.push(type==="url" ? {id, type, on:true, ru:"", en:"", url:""} : {id, type, on:true, ru:"", en:"", text_ru:"", text_en:""});
  buiList(); buiPreview();
  const rows = document.querySelectorAll("#bui_list .brow"); const last = rows[rows.length-1]; last.scrollIntoView({behavior:"smooth", block:"center"}); last.querySelector("input[type=text]").focus();
}
function buiTexts(){
  const l = BPREV.lang, T = BUI.cfg.texts;
  const names = [["welcome","Приветствие (после первого /start)"],["menu","Главное меню"],["help","Как подключиться"]];
  $("#bui_texts").innerHTML = names.map(([k,t]) => `<label>${t}</label>
    <textarea id="bt_${k}" rows="${k==="help"?9:6}" oninput="BUI.cfg.texts['${k}_${l}']=this.value;BPREV.view='${k}';segbtn('#pv_view','v','${k}',null,true);buiPreview()">${esc(T[k+"_"+l]||"")}</textarea>
    <div class="chips">${BUI.placeholders.map(p=>`<button type="button" onclick="buiIns('${k}','{${p}}')">{${p}}</button>`).join("")}<button type="button" onclick="buiIns('${k}','<b></b>')">&lt;b&gt;</button><button type="button" onclick="buiDefText('${k}')">↺ стандартный</button></div>`).join("");
}
function buiIns(k, txt){
  const ta = $("#bt_"+k), a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
  ta.value = ta.value.slice(0,a) + txt + ta.value.slice(b); ta.focus(); ta.selectionStart = ta.selectionEnd = a + (txt==="<b></b>"?3:txt.length);
  ta.dispatchEvent(new Event("input"));
}
function buiDefText(k){ const key = k+"_"+BPREV.lang; BUI.cfg.texts[key] = BUI.defaults.texts[key]; buiTexts(); BPREV.view = k; segbtn('#pv_view','v',k,null,true); buiPreview(); }
function tgHtml(src){
  let h = esc(src);
  h = h.replace(/&lt;(\/?)(b|strong|i|em|u|ins|s|strike|del|code|pre)&gt;/g, "<$1$2>");
  h = h.replace(/&lt;a href=(?:&quot;|&#39;)(https?:\/\/[^"'<>\s]+?|tg:\/\/[^"'<>\s]+?)(?:&quot;|&#39;)&gt;/g, '<a href="$1" target="_blank" rel="noopener">').replace(/&lt;\/a&gt;/g, "</a>");
  return h;
}
function buiRender(tpl, v){
  const keys = BUI.placeholders;
  const lines = tpl.split("\n").filter(line => !keys.some(k => line.includes("{"+k+"}") && !v[k]));
  let t = lines.join("\n"); keys.forEach(k => t = t.split("{"+k+"}").join(v[k]||""));
  return t.replace(/\n{3,}/g, "\n\n").trim();
}
function buiPreview(){
  if (!$("#pv_msg")) return;
  const l = BPREV.lang, en = l === "en";
  const page = BUI.public_url ? BUI.public_url + "/u/AbC123xyz" : "";
  const v = {title: BUI.title||"VPN", name: en?"Alex":"Иван", status: en?"Active":"Активна", expires: en?"07/12/2026":"07.12.2026", page, support: (BUI.support||"").trim()};
  const tpl = BUI.cfg.texts[BPREV.view+"_"+l] || "";
  $("#pv_msg").innerHTML = tgHtml(buiRender(tpl, v)) || `<span style="opacity:.5">${en?"(empty)":"(пусто)"}</span>`;
  const sup = (BUI.support||"").trim(), supOk = sup.startsWith("@") || /^(https?|tg):\/\//.test(sup);
  const rows = [];
  BUI.cfg.buttons.forEach(b => {
    if (b.on === false) return;
    if (b.id === "page" && !BUI.public_url) return;
    if (b.id === "phone" && BPREV.phone) return;
    if (b.id === "support" && !supOk) return;
    const def = BUI.builtin[b.id];
    const text = (en ? (b.en || b.ru) : (b.ru || b.en)) || (def ? def[en?1:0] : "?");
    const url = b.id === "page" || b.id === "support" || b.type === "url";
    const btn = `<div class="b ${url?"u":""}" title="${esc(text)}">${esc(text)}</div>`;
    if (b.same_row && rows.length && rows[rows.length-1].length < BUI.cfg.max_row) rows[rows.length-1].push(btn); else rows.push([btn]);
  });
  $("#pv_kb").innerHTML = rows.map(r => `<div class="r">${r.join("")}</div>`).join("");
}

start();
</script>
